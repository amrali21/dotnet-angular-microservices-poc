networks:
  microservices-net:
    driver: bridge

services:
  eureka-server:
    build:
      context: ./eureka-server
    # Registry-qualified name (Docker Hub) so `docker compose push` can publish it.
    # NOTE: eureka is NOT used by the k8s deployment (k8s-native discovery) — it
    # is pushed only for completeness of the compose stack.
    image: xamrxxx/eureka-server:${TAG:-latest}
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - "RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}"
      - "RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  invoice-service:
    build:
      context: ./ledgerly-backend-invoice-service
    image: xamrxxx/invoice-service:${TAG:-latest}
    container_name: invoice-service
    ports:
      - "5052:5052"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5052
      - "ConnectionStrings__DefaultConnection=${INVOICE_DB}"
      - "Jwt__Key=${JWT_KEY}"
      - "Jwt__Issuer=${JWT_ISSUER}"
      - "Jwt__Audience=${JWT_AUDIENCE}"
      - "RabbitMQ__UserName=${RABBITMQ_USER:-guest}"
      - "RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cust-service:
    build:
      context: ./ledgerly-backend-cust-service
    image: xamrxxx/cust-service:${TAG:-latest}
    container_name: cust-service
    ports:
      - "5246:5246"
      - "5247:5247"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # No ASPNETCORE_URLS here: cust-service's Kestrel:Endpoints in
      # appsettings.json (Http:5246 + Grpc:5247) takes precedence and would
      # silently override it anyway — see appsettings.json for the ports.
      - "ConnectionStrings__DefaultConnection=${CUSTOMER_DB}"
      - "Jwt__Key=${JWT_KEY}"
      - "Jwt__Issuer=${JWT_ISSUER}"
      - "Jwt__Audience=${JWT_AUDIENCE}"
      - "RabbitMQ__UserName=${RABBITMQ_USER:-guest}"
      - "RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard-service:
    build:
      context: ./ledgerly-backend-dashboard-service
    image: xamrxxx/dashboard-service:${TAG:-latest}
    container_name: dashboard-service
    ports:
      - "5208:5208"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5208
      - "ConnectionStrings__DefaultConnection=${DASHBOARD_DB}"
      - "Jwt__Key=${JWT_KEY}"
      - "Jwt__Issuer=${JWT_ISSUER}"
      - "Jwt__Audience=${JWT_AUDIENCE}"
      - "RabbitMQ__UserName=${RABBITMQ_USER:-guest}"
      - "RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    build:
      context: ./ledgerly-backend-auth-service
    image: xamrxxx/auth-service:${TAG:-latest}
    container_name: auth-service
    ports:
      - "5109:5109"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5109
      - "ConnectionStrings__DefaultConnection=${AUTH_DB}"
      - "Jwt__Key=${JWT_KEY}"
      - "Jwt__Issuer=${JWT_ISSUER}"
      - "Jwt__Audience=${JWT_AUDIENCE}"
      - "Jwt__ExpiresMinutes=${JWT_EXPIRES_MINUTES}"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gateway:
    build:
      context: ./ledgerly-api-gateway
    image: xamrxxx/api-gateway:${TAG:-latest}
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - "Jwt__Key=${JWT_KEY}"
      - "Jwt__Issuer=${JWT_ISSUER}"
      - "Jwt__Audience=${JWT_AUDIENCE}"
    networks:
      - microservices-net
    depends_on:
      eureka-server:
        condition: service_healthy

  angular-frontend:
    build:
      context: ./angular-frontend
    # Default build bakes the "docker" Angular config (ACTION_URL=http://localhost:8080).
    # For the k8s/cloud image build with docker-compose.push.yml, which overrides
    # the NG_CONFIG build-arg to "kubernetes" (ACTION_URL='' -> same-origin via Ingress).
    image: xamrxxx/angular-frontend:${TAG:-latest}
    container_name: angular-frontend
    ports:
      - "4200:80"
    networks:
      - microservices-net
    depends_on:
      - api-gateway
