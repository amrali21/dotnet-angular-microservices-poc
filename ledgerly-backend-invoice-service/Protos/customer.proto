syntax = "proto3";

option csharp_namespace = "ledgerly_backend.Grpc";

package customer;

service CustomerLookup {
  rpc GetCustomerById (CustomerIdRequest) returns (CustomerReply);
  rpc GetCustomersByIds (CustomerIdListRequest) returns (CustomerListReply);
  rpc SearchCustomerIds (CustomerSearchRequest) returns (CustomerIdListReply);
}

message CustomerIdRequest {
  string id = 1;
}

message CustomerIdListRequest {
  repeated string ids = 1;
}

message CustomerSearchRequest {
  string query = 1;
}

message CustomerIdListReply {
  repeated string ids = 1;
}

message CustomerReply {
  string id = 1;
  string name = 2;
  string email = 3;
  string image_url = 4;
  bool found = 5;
}

message CustomerListReply {
  repeated CustomerReply customers = 1;
}
