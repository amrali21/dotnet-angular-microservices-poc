# ----------------------------------------------------------------------------
# TEMPLATE — copy this to 04-jwt-secret.yaml and fill in a real signing key.
#
#   cp k8s/04-jwt-secret.example.yaml k8s/04-jwt-secret.yaml
#   # then edit Jwt__Key in 04-jwt-secret.yaml
#
# 04-jwt-secret.yaml is gitignored on purpose, same as 01-db-secret.yaml. This
# .example file (placeholders only) IS committed, so the repo documents what
# the secret should look like. kustomization.yaml references 04-jwt-secret.yaml,
# so that file must exist locally before `kubectl apply -k`.
#
# Jwt__Key must be BYTE-IDENTICAL to the value auth-service, api-gateway, and
# invoice/cust/dashboard-service all use — auth-service signs tokens with it,
# the other four validate signatures with it. A mismatch anywhere means every
# protected call 401s. Generate a real value with, e.g.:
#   openssl rand -base64 64
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: microservices
type: Opaque
stringData:
  Jwt__Key: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES"
  Jwt__Issuer: "nextjs-microservices-auth"
  Jwt__Audience: "nextjs-microservices-clients"
  Jwt__ExpiresMinutes: "60"
