# ----------------------------------------------------------------------------
# TEMPLATE — copy this to 04-rabbitmq-secret.yaml and fill in real credentials.
#
#   cp k8s/04-rabbitmq-secret.example.yaml k8s/04-rabbitmq-secret.yaml
#   # then edit the password in 04-rabbitmq-secret.yaml
#
# 04-rabbitmq-secret.yaml is gitignored on purpose, same as 01-db-secret.yaml
# and 04-jwt-secret.yaml. This .example file (placeholders only) IS committed.
# kustomization.yaml references 04-rabbitmq-secret.yaml, so that file must
# exist locally before `kubectl apply -k`.
#
# RABBITMQ_DEFAULT_USER/PASS seed the broker itself (k8s/05-rabbitmq.yaml).
# RabbitMQ__UserName/Password are the same credentials, injected into
# invoice/cust/dashboard-service so they can authenticate against it.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: microservices
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME_PASSWORD"
  RabbitMQ__UserName: "guest"
  RabbitMQ__Password: "CHANGE_ME_PASSWORD"
