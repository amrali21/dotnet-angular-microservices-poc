apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservices
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5109
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5109"
          envFrom:
            - configMapRef:
                name: dotnet-common-config
            - secretRef:
                name: db-secret
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # TCP probes make NO assumption about a /health endpoint existing.
          readinessProbe:
            tcpSocket:
              port: 5109
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5109
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: microservices
  labels:
    app: auth-service
spec:
  type: ClusterIP          # internal only — reachable as http://auth-service:5109
  selector:
    app: auth-service
  ports:
    - port: 5109
      targetPort: 5109
