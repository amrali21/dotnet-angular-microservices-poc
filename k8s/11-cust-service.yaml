apiVersion: apps/v1
kind: Deployment
metadata:
  name: cust-service
  namespace: microservices
  labels:
    app: cust-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cust-service
  template:
    metadata:
      labels:
        app: cust-service
    spec:
      containers:
        - name: cust-service
          image: cust-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5246
            - containerPort: 5247
          # No ASPNETCORE_URLS: cust-service's Kestrel:Endpoints in
          # appsettings.json (Http:5246 + Grpc:5247) takes precedence and
          # would silently override it anyway.
          envFrom:
            - configMapRef:
                name: dotnet-common-config
            - secretRef:
                name: customer-db-secret
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 5246
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5246
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cust-service
  namespace: microservices
  labels:
    app: cust-service
spec:
  type: ClusterIP          # internal only — reachable as http://cust-service:5246
  selector:
    app: cust-service
  ports:
    - name: rest
      port: 5246
      targetPort: 5246
    - name: grpc
      port: 5247
      targetPort: 5247
