<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Ledgerly — Billing Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Ledgerly — invoicing and customer billing console running on a .NET microservices backend.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- The PrimeNG theme is swapped at runtime by ThemeService. Both themes are
       copied to /themes by the Angular asset pipeline (see angular.json). This
       inline bootstrap picks the right one before first paint to avoid a flash. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('ledgerly.theme'); } catch (e) { /* storage blocked */ }
      var mode = (stored === 'dark' || stored === 'light')
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      var link = document.createElement('link');
      link.id = 'primeng-theme';
      link.rel = 'stylesheet';
      link.href = 'themes/aura-' + mode + '-indigo/theme.css';
      document.head.appendChild(link);
    })();
  </script>
</head>

<body>
  <app-root>
    <div class="app-boot">
      <div class="app-boot__mark">L</div>
      <p>Loading Ledgerly…</p>
    </div>
  </app-root>
</body>

</html>
