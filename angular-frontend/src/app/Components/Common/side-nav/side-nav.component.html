<nav class="nav" aria-label="Main">

  <a class="brand" routerLink="/" (click)="navigated.emit()">
    <span class="brand__mark">L</span>
    <span class="brand__text">
      <strong>Ledgerly</strong>
      <small>Billing console</small>
    </span>
  </a>

  <p class="nav__label">Manage</p>
  <ul class="nav__list">
    @for (item of items; track item.route) {
    <li>
      <a class="nav__item" [routerLink]="item.route" routerLinkActive="nav__item--active"
        [routerLinkActiveOptions]="{ exact: item.exact }" (click)="navigated.emit()">
        <i class="pi" [ngClass]="item.icon"></i>
        <span class="nav__item-label">{{ item.label }}</span>
        <span class="nav__item-service">{{ item.service }}</span>
      </a>
    </li>
    }
  </ul>

  <!-- Architecture footer: this is a microservices POC, so the topology is part
       of what the UI is meant to show off. -->
  <div class="nav__foot">
    <p class="nav__label">Backing services</p>
    <ul class="topology">
      @for (service of services; track service) {
      <li><span class="service-chip">{{ service }}</span></li>
      }
    </ul>
    <p class="nav__version">v{{ version }} · .NET + Angular POC</p>
  </div>
</nav>
