<div class="auth-page">
  <div class="auth-card surface-card">
    <div class="auth-card__brand">
      <span class="brand__mark">L</span>
      <strong>Ledgerly</strong>
    </div>

    <div class="card-head">
      <div>
        <h2>Sign in</h2>
        <p class="card-head__sub">Use your Ledgerly account to continue.</p>
      </div>
    </div>

    <div class="card-body">
      @if (error()) {
      <div class="banner banner--error" role="alert">
        <i class="pi pi-exclamation-triangle"></i>
        <div>
          <strong>Couldn't sign you in</strong>
          <p>{{ error() }}</p>
        </div>
      </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" pInputText formControlName="email" autocomplete="email"
            [class.p-invalid]="showError('email')" />
          @if (showError('email')) {
          <small class="field__error"><i class="pi pi-exclamation-circle"></i> Enter a valid email address.</small>
          }
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" pInputText formControlName="password" autocomplete="current-password"
            [class.p-invalid]="showError('password')" />
          @if (showError('password')) {
          <small class="field__error"><i class="pi pi-exclamation-circle"></i> Password is required.</small>
          }
        </div>

        <div class="form__actions form__actions--stretch">
          <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
            <i class="pi" [ngClass]="submitting() ? 'pi-spin pi-spinner' : 'pi-sign-in'"></i>
            {{ submitting() ? 'Signing in…' : 'Sign in' }}
          </button>
        </div>
      </form>

      <p class="auth-card__switch">Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
