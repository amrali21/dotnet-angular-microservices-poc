@if (isAuthRoute()) {
<router-outlet />
} @else {
<div class="shell" [class.shell--nav-open]="navOpen()">

  <app-side-nav class="shell__nav" (navigated)="closeNav()" />

  <!-- Only visible below the tablet breakpoint, where the nav becomes a drawer -->
  <div class="shell__scrim" (click)="closeNav()" aria-hidden="true"></div>

  <div class="shell__main">
    <header class="topbar">
      <button type="button" class="icon-btn topbar__burger" (click)="toggleNav()" aria-label="Toggle navigation">
        <i class="pi pi-bars"></i>
      </button>

      <nav class="topbar__crumbs" aria-label="Breadcrumb">
        <i class="pi pi-th-large"></i>
        <span>Workspace</span>
        <i class="pi pi-angle-right topbar__sep"></i>
        <strong>{{ sectionTitle() }}</strong>
      </nav>

      <div class="topbar__actions">
        <span class="env-pill" pTooltip="Every call is routed through the Ocelot API gateway" tooltipPosition="bottom">
          <i class="pi pi-server"></i> demo environment
        </span>

        <button type="button" class="icon-btn" (click)="theme.toggle()"
          [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          [pTooltip]="theme.isDark() ? 'Light theme' : 'Dark theme'" tooltipPosition="bottom">
          <i class="pi" [ngClass]="theme.isDark() ? 'pi-sun' : 'pi-moon'"></i>
        </button>

        @if (auth.currentUser(); as user) {
        <div class="topbar__user">
          <span class="avatar" [style.background]="colorFor(user.displayName)">{{ initialsOf(user.displayName) }}</span>
          <span class="topbar__user-meta">
            <strong>{{ user.displayName }}</strong>
            <small>{{ user.email }}</small>
          </span>
        </div>

        <button type="button" class="icon-btn" (click)="logout()" aria-label="Sign out" pTooltip="Sign out"
          tooltipPosition="bottom">
          <i class="pi pi-sign-out"></i>
        </button>
        }
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
}
